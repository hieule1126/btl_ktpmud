services:
  mysql:
    image: mysql:8.4
    container_name: warehouse-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: kho123456
      MYSQL_DATABASE: warehouse_management
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pkho123456"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:
